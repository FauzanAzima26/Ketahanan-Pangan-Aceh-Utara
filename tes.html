<script type="text/javascript">
  CMS.Loaded(async function () {
    // === helper untuk load script eksternal ===
    const loadScript = (src) =>
      new Promise((res) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        document.body.appendChild(s);
      });

    // === helper share sosmed ===
    function sosmed(judul) {
      const url = window.location.href;
      return `
        <a href="//www.facebook.com/share.php?u=${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/facebook.png" width="24"/></a>
        <a href="//twitter.com/intent/tweet?url=${url}&text=${judul}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/twitter.png" width="24"/></a>
        <a href="whatsapp://send?text=${judul} ${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/whatsapp.png" width="24"/></a>`;
    }

    try {
      let allData = [];

      // === 1️⃣ Ambil data dari API Satu Data Aceh Utara ===
      const urlSatuData =
        "https://satudata.acehutara.go.id/api/3/action/datastore_search?resource_id=559e8bea-c48b-4bda-adbf-5fc146c160ec&limit=500";
      const resSatuData = await fetch(urlSatuData);
      const jsonSatuData = await resSatuData.json();

      if (resSatuData.ok && jsonSatuData.success) {
        const dataSatuData = jsonSatuData.result.records.map((r) => ({
          kecamatan: r.kemendagri_nama_kecamatan || "-",
          komoditas: r.komotditi || "-",
          luas: parseFloat((r.luas_panen || "0").toString().replace(",", ".")),
          tahun: r.tahun || "2023",
          satuan: "Ha",
          sumber: "Satu Data",
        }));
        console.log("✅ Satu Data:", dataSatuData.length);
        allData = allData.concat(dataSatuData);
      }

      // Tahun dinamis (misal 2020 s.d. tahun sekarang)
      const currentYear = new Date().getFullYear();
      const startYear = 2020;
      const years = Array.from(
        { length: currentYear - startYear + 1 },
        (_, i) => startYear + i
      );

      // Template endpoint
      const baseURL =
        "https://webapi.bps.go.id/v1/api/interoperabilitas/datasource/simdasi/id/25";
      const wilayah = "1111000";
      const key = "9a994cbfdcba3e84dbe9eceba615a65f";

      // ID tabel untuk luas dan produksi
      const idTabelLuas = "bXNVb1pmZndqUDhKWElUSjhZRitidz09";
      const idTabelProduksi = "eHEwRmg2VUZjY2lWNWNYaVhQK1h4QT09";

      // 🔹 Buat dua kelompok URL dinamis
      const urls = {
        luas: years.map(
          (y) =>
            `${baseURL}/tahun/${y}/id_tabel/${idTabelLuas}/wilayah/${wilayah}/key/${key}`
        ),
        produksi: years.map(
          (y) =>
            `${baseURL}/tahun/${y}/id_tabel/${idTabelProduksi}/wilayah/${wilayah}/key/${key}`
        ),
      };

      const results = await Promise.all([
        // gabungkan luas + produksi
        ...urls.luas.map((url, i) =>
          fetch(url)
            .then((r) => r.json().catch(() => null))
            .then((j) => ({ jenis: "luas", tahun: years[i], json: j }))
        ),
        ...urls.produksi.map((url, i) =>
          fetch(url)
            .then((r) => r.json().catch(() => null))
            .then((j) => ({ jenis: "produksi", tahun: years[i], json: j }))
        ),
      ]);

      for (const { jenis, tahun, json } of results) {
        if (!json || !json.data || !json.data[1]) continue;
        const tabel = json.data[1];
        const rows = tabel.data || [];
        const kolom = tabel.kolom || {};
        const sumber = `BPS ${tahun} (${jenis})`;

        const dataParsed = [];

        rows.forEach((kec) => {
          const namaKec = (kec.label || "-").trim();
          const vars = kec.variables || {};

          for (const kodeVar in vars) {
            if (!kolom[kodeVar]) continue;
            const meta = kolom[kodeVar];
            let komoditasRaw =
              meta.nama_variabel?.replace(/\(.*?\)/g, "").trim() || "-";

            // 🔧 Hapus awalan “Luas Panen” / “Produksi” biar komoditas gabung
            let komoditas = komoditasRaw
              .replace(/^Luas\s*Panen\s*/i, "")
              .replace(/^Produksi\s*/i, "")
              .trim();

            let rawVal =
              vars[kodeVar]?.value ?? vars[kodeVar]?.v ?? vars[kodeVar] ?? 0;
            let val =
              parseFloat(
                String(rawVal)
                  .replace(/[^\d.,-]/g, "")
                  .replace(/\./g, "")
                  .replace(",", ".")
              ) || 0;

            if ((meta.satuan || "").toLowerCase().includes("m<sup>2"))
              val /= 10000;

            // Cari data komoditas yang sudah ada
            let existing = dataParsed.find(
              (d) => d.kecamatan === namaKec && d.komoditas === komoditas
            );

            // Jika belum ada, buat baru
            if (!existing) {
              existing = {
                kecamatan: namaKec,
                komoditas,
                tahun,
                satuan: meta.satuan || "-",
                sumber,
              };
              dataParsed.push(existing);
            }

            // Masukkan ke kolom luas atau produksi
            if (jenis === "produksi") {
              existing.produksi = (existing.produksi || 0) + val;
            } else {
              existing.luas = (existing.luas || 0) + val;
            }
          }
        });

        allData = allData.concat(dataParsed);
      }

      console.log("📊 Total data gabungan:", allData.length);
      window.allData = allData;

      // === 2. Judul & breadcrumb ===
      $(".share-link").append(sosmed("Dashboard Panen"));
      $(".breadcrumb").html(`
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Dashboard</li>`);

      // === 3. Routing halaman ===
      if (segments(1) === "halaman" && segments(2) === "ketahanan-pangan") {
        // --- Halaman khusus dashboard ---
        setTitle("Dashboard Luas Panen (Satu Data + BPS)");
        $(".judul-berita").html("Tren Ketahanan Pangan Aceh Utara");
        $(".isi-berita").html(`<!-- 🔍 FILTER -->
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Kecamatan</strong></label>
        <select class="form-select custom-select" id="filterKecamatan">
          <option value="">-- Semua Kecamatan --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Komoditas</strong></label>
        <select class="form-select custom-select" id="filterKomoditas">
          <option value="">-- Semua Komoditas --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Tahun</strong></label>
        <select class="form-select custom-select" id="filterTahun">
          <option value="">-- Semua Tahun --</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- 📌 RINGKASAN KPI -->
<div class="row mb-3 text-center">
  <div class="col-md-3">
    <div class="kpi-card orange">
      <span id="totalLuas" class="card-value">0</span><small> Ha</small><br />
      <span class="card-text"><strong>Total Luas Panen</strong></span>
      <i class="fas fa-seedling icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card purple">
      <span id="hargaRata" class="card-value">0</span><small> Rp/kg</small
      ><br />
      <span class="card-text"><strong>Harga Rata-rata</strong></span>
      <i class="fas fa-coins icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card grey-dark">
      <span id="kecTerluas" class="card-value">-</span><br />
      <span class="card-text"><strong>Kecamatan Terluas</strong></span>
      <i class="fas fa-map-marker-alt icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card red">
      <span id="komTerluas" class="card-value">-</span><br />
      <span class="card-text"><strong>Komoditas Terluas</strong></span>
      <i class="fas fa-leaf icon"></i>
    </div>
  </div>
</div>

<!-- 🗺️ PETA & GRAFIK -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3">
          10 Kecamatan dengan Produksi Luas Panen Tertinggi (Ha)
        </h6>
        <div id="horizontalBarChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
  <div class="card shadow-sm flex-fill">
    <div class="card-body">
      <h6 class="text-center fw-bold" style="margin-bottom: 40px">Peta Kabupaten Aceh Utara</h6>
      <div id="mapContainer" style="height: 400px"></div>
      <div id="mapLegend" class="mt-2"></div>
    </div>
  </div>
</div>
</div>

<!-- 📊 PIE & Treemap -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-body">
        <h6 class="text-center fw-semibold" style="margin-bottom: 20px">
          Luas Panen Tanaman Pokok (Ha)
        </h6>
        <div id="pieChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3">
          Luas panen Sayuran dan Buah-Buahan
        </h6>
        <div id="sayurBuahChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
</div>

<!-- 📊 DUA CHART BERDAMPINGAN -->
<div class="row mb-3">
  <!-- Chart 1 -->
  <div class="col-lg-6 d-flex mb-3 mb-lg-0">
    <div class="card shadow-sm flex-fill w-100">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3">
          10 Kecamatan dengan Produksi Pertanian Tertinggi (Kw)
        </h6>
        <div id="vertikalBarChart" style="height: 400px"></div>
      </div>
    </div>
  </div>

  <!-- Chart 2 -->
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill w-100">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3">
          Tren Luas Panen per Tahun
        </h6>
        <div id="#" style="height: 400px"></div>
      </div>
    </div>
  </div>
</div>
  </div>
</div>`);
        $(".card").fadeIn();

        // load chart lib
        await loadScript("https://cdn.jsdelivr.net/npm/apexcharts");
        await loadScript("https://cdn.jsdelivr.net/npm/jsvectormap");
        await loadScript(
          "/themes/_ceudah-copy/assets/js/chart-dashboard.js?v=" + Date.now()
        );
        await loadScript(
          "/themes/_ceudah-copy/assets/js/kecamatanmap.js?v=" + Date.now()
        );
        await loadScript(
          "/themes/_ceudah-copy/assets/js/map-dashboard.js?v=" + Date.now()
        );

        // render dashboard
        initDashboard(allData);
      } else if (segments(1) === "halaman" || segments(1) === "berita") {
        const jsonUrl =
          "/json" + cleanSlash(window.location.pathname) + ".json?mode=origin";
        fetch(jsonUrl)
          .then((r) => r.json())
          .then((json) => {
            setTitle(json.judul);
            $(".judul-berita").html(json.judul);
            $(".isi-berita").html(json.konten);
            $(".card").fadeIn();
          });
      }
    } catch (err) {
      console.error("❌ Gagal load data API:", err);
    }
  }); // ✅ Penutup CMS.Loaded
</script>
