<script type="text/javascript">
  CMS.Loaded(async function () {
    // === helper untuk load script eksternal ===
    const loadScript = (src) =>
      new Promise((res) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        document.body.appendChild(s);
      });

    // === helper share sosmed ===
    function sosmed(judul) {
      const url = window.location.href;
      return `
        <a href="//www.facebook.com/share.php?u=${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/facebook.png" width="24"/></a>
        <a href="//twitter.com/intent/tweet?url=${url}&text=${judul}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/twitter.png" width="24"/></a>
        <a href="whatsapp://send?text=${judul} ${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/whatsapp.png" width="24"/></a>`;
    }

    try {
      let allData = [];

      // ================================
      // 1. Tahun Dinamis
      // ================================
      const currentYear = new Date().getFullYear();
      const startYear = 2020;
      const years = Array.from(
        { length: currentYear - startYear + 1 },
        (_, i) => startYear + i
      );

      // ================================
      // 2. Base URL dan Key BPS
      // ================================
      const baseURL =
        "https://webapi.bps.go.id/v1/api/interoperabilitas/datasource/simdasi/id/25";
      const key = "9a994cbfdcba3e84dbe9eceba615a65f";

      // ================================
      // 3. Konfigurasi per Jenis Data
      // ================================
      const configs = [
        {
          jenis: "luas_sayur",
          wilayah: "1111000", // Aceh Utara
          id_tabel: "bXNVb1pmZndqUDhKWElUSjhZRitidz09",
          tingkat: "kecamatan",
        },
        {
          jenis: "produksi_sayur",
          wilayah: "1111000", // Aceh Utara
          id_tabel: "eHEwRmg2VUZjY2lWNWNYaVhQK1h4QT09",
          tingkat: "kecamatan",
        },
        {
          jenis: "padi_provinsi",
          wilayah: "1100000", // Provinsi Aceh
          id_tabel: "ZjZ6MXlacGJNR0JaaHBPRSs0TzNUdz09",
          tingkat: "kabupaten",
        },
      ];

      // ================================
      // 4. Generate URL untuk Semua Tahun
      // ================================
      const urls = configs.flatMap((cfg) =>
        years.map((y) => ({
          jenis: cfg.jenis,
          tahun: y,
          tingkat: cfg.tingkat,
          url: `${baseURL}/tahun/${y}/id_tabel/${cfg.id_tabel}/wilayah/${cfg.wilayah}/key/${key}`,
        }))
      );

      // ================================
      // 5. Fetch Semua API Sekaligus
      // ================================
      const results = await Promise.all(
        urls.map((u) =>
          fetch(u.url)
            .then((r) => r.json().catch(() => null))
            .then((j) => ({
              jenis: u.jenis,
              tahun: u.tahun,
              tingkat: u.tingkat,
              json: j,
            }))
        )
      );

      // ================================
      // 6. Parsing dan Gabungkan ke Data Global
      // ================================
      let dataSayurBuah = []; // gabungan luas + produksi sayur
      let dataPadiProvinsi = []; // khusus padi provinsi

      for (const { jenis, tahun, tingkat, json } of results) {
        if (!json || !json.data || !json.data[1]) continue;

        const tabel = json.data[1];
        const rows = tabel.data || [];
        const kolom = tabel.kolom || {};
        const sumber = `BPS ${tahun} (${jenis})`;
        const parsed = [];

        rows.forEach((wilayah) => {
          const namaWil = (wilayah.label || "-").trim();
          const vars = wilayah.variables || {};

          for (const kodeVar in vars) {
            if (!kolom[kodeVar]) continue;
            const meta = kolom[kodeVar];

            let komoditas =
              meta.nama_variabel?.replace(/\(.*?\)/g, "").trim() || "-";
            let rawVal =
              vars[kodeVar]?.value ?? vars[kodeVar]?.v ?? vars[kodeVar] ?? 0;
            let val =
              parseFloat(
                String(rawVal)
                  .replace(/[^\d.,-]/g, "")
                  .replace(/\./g, "")
                  .replace(",", ".")
              ) || 0;

            // Ubah m2 → ha
            if ((meta.satuan || "").toLowerCase().includes("m<sup>2"))
              val /= 10000;

            let existing = parsed.find(
              (d) => d.wilayah === namaWil && d.komoditas === komoditas
            );
            if (!existing) {
              existing = {
                wilayah: namaWil,
                tingkat,
                komoditas,
                tahun,
                satuan: meta.satuan || "-",
                sumber,
              };
              parsed.push(existing);
            }

            if (jenis.includes("produksi")) existing.produksi = val;
            else if (jenis.includes("luas")) existing.luas = val;
            else existing.nilai = val; // misalnya padi
          }
        });

        // Gabungkan sesuai jenis
        if (jenis.includes("padi")) {
          dataPadiProvinsi = dataPadiProvinsi.concat(parsed);
        } else {
          dataSayurBuah = dataSayurBuah.concat(parsed);
        }
      }

      // ================================
      // 7. Data Siap Digunakan
      // ================================
      console.log("✅ Data Sayuran & Buah:", dataSayurBuah);
      console.log("✅ Data Padi Provinsi:", dataPadiProvinsi);

      // === 2. Judul & breadcrumb ===
      $(".share-link").append(sosmed("Dashboard Panen"));
      $(".breadcrumb").html(`
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Dashboard</li>`);

      // === 3. Routing halaman ===
      if (segments(1) === "halaman" && segments(2) === "ketahanan-pangan") {
        // --- Halaman khusus dashboard ---
        setTitle("Dashboard Luas Panen (Satu Data + BPS)");
        $(".judul-berita").html("Tren Ketahanan Pangan Aceh Utara");
        $(".isi-berita").html(`<!-- 🔍 FILTER -->
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Kecamatan</strong></label>
        <select class="form-select custom-select" id="filterKecamatan">
          <option value="">-- Semua Kecamatan --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Komoditas</strong></label>
        <select class="form-select custom-select" id="filterKomoditas">
          <option value="">-- Semua Komoditas --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Tahun</strong></label>
        <select class="form-select custom-select" id="filterTahun">
          <option value="">-- Semua Tahun --</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- 📌 RINGKASAN KPI -->
<div class="row mb-3 text-center">
  <div class="col-md-2">
    <div class="kpi-card orange">
      <span id="totalLuas" class="card-value">0</span><small> Ha</small><br />
      <span class="card-text"><strong>Total Luas Panen</strong></span>
      <i class="fas fa-seedling icon"></i>
    </div>
  </div>

  <div class="col-md-2">
    <div class="kpi-card green">
      <span id="totalProduksi" class="card-value">0</span><small> Kw</small><br />
      <span class="card-text"><strong>Total Produksi</strong></span>
      <i class="fas fa-tractor icon"></i>
    </div>
  </div>

  <div class="col-md-2">
    <div class="kpi-card purple">
      <span id="kecTerluas" class="card-value">-</span><br />
      <span class="card-text"><strong>Kecamatan Terluas</strong></span>
      <i class="fas fa-map-marker-alt icon"></i>
    </div>
  </div>

  <div class="col-md-2">
    <div class="kpi-card red">
      <span id="komDominan" class="card-value">-</span><br />
      <span class="card-text"><strong>Komoditas Dominan</strong></span>
      <i class="fas fa-leaf icon"></i>
    </div>
  </div>

  <div class="col-md-2">
    <div class="kpi-card blue">
      <span id="rataProduksi" class="card-value">0</span><small> Kw/th</small><br />
      <span class="card-text"><strong>Rata-rata Produksi</strong></span>
      <i class="fas fa-chart-line icon"></i>
    </div>
  </div>

  <div class="col-md-2">
    <div class="kpi-card grey-dark">
      <span id="jumlahKecamatan" class="card-value">0</span><br />
      <span class="card-text"><strong>Kecamatan Aktif</strong></span>
      <i class="fas fa-map icon"></i>
    </div>
  </div>
</div>

<!-- 🗺️ PETA & GRAFIK -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3" id="horizontalBarTitle">
          10 Kecamatan dengan Produksi Luas Panen Tertinggi (Ha)
        </h6>
        <div id="horizontalBarChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
  <div class="card shadow-sm flex-fill">
    <div class="card-body">
      <h6 class="text-center fw-bold" style="margin-bottom: 40px">Peta Kabupaten Aceh Utara</h6>
      <div id="mapContainer" style="height: 400px"></div>
      <div id="mapLegend" class="mt-2"></div>
    </div>
  </div>
</div>
</div>

<!-- 📊 PIE & Treemap -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-body">
        <h6 class="text-center fw-semibold" style="margin-bottom: 20px" id="pieTitle">
          Luas Panen Tanaman Pokok (Ha)
        </h6>
        <div id="pieChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3" id="treeMapTitle">
          Luas panen Sayuran dan Buah-Buahan
        </h6>
        <div id="sayurBuahChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
</div>

<!-- 📊 DUA CHART BERDAMPINGAN -->
<div class="row mb-3">
  <!-- Chart 1 -->
  <div class="col-lg-6 d-flex mb-3 mb-lg-0">
    <div class="card shadow-sm flex-fill w-100">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3" id="vertikalBarTitle">
          10 Kecamatan dengan Produksi Pertanian Tertinggi (Kw)
        </h6>
        <div id="vertikalBarChart" style="height: 400px"></div>
      </div>
    </div>
  </div>

  <!-- Chart 2 -->
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill w-100">
      <div class="card-body">
        <h6 class="text-center fw-semibold mb-3" id="chartKomoditasTitle">
          Produksi Sayuran dan Buah-Buahan
        </h6>
        <div id="stackedChart" style="height: 400px"></div>
      </div>
    </div>
  </div>
</div>
  </div>
</div>`);
        $(".card").fadeIn();

        // load chart lib
        await loadScript("https://cdn.jsdelivr.net/npm/apexcharts");
        await loadScript("https://cdn.jsdelivr.net/npm/jsvectormap");
        await loadScript(
          "/themes/_ceudah-copy/assets/js/chart-dashboard.js?v=" + Date.now()
        );
        await loadScript(
          "/themes/_ceudah-copy/assets/js/kecamatanmap.js?v=" + Date.now()
        );
        await loadScript(
          "/themes/_ceudah-copy/assets/js/map-dashboard.js?v=" + Date.now()
        );

        // Gabungkan semua data
        allData = dataSayurBuah.concat(dataPadiProvinsi);

        // Normalisasi nama field
        allData = allData.map((d) => ({
          ...d,
          kecamatan: d.wilayah,
        }));

        console.log("✅ Data Sayuran & Buah:", dataSayurBuah.length);
        console.log("✅ Data Padi Provinsi:", dataPadiProvinsi.length);
        console.log("📊 Jumlah record:", allData.length);

        // render dashboard
        initDashboard(allData);

        // render dashboard
        initDashboard(allData);
      } else if (segments(1) === "halaman" || segments(1) === "berita") {
        const jsonUrl =
          "/json" + cleanSlash(window.location.pathname) + ".json?mode=origin";
        fetch(jsonUrl)
          .then((r) => r.json())
          .then((json) => {
            setTitle(json.judul);
            $(".judul-berita").html(json.judul);
            $(".isi-berita").html(json.konten);
            $(".card").fadeIn();
          });
      }
    } catch (err) {
      console.error("❌ Gagal load data API:", err);
    }
  }); // ✅ Penutup CMS.Loaded
</script>
