      function sosmed(judul) {
        const url = window.location.href;

          <a href="whatsapp://send?text=${judul} ${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/whatsapp.png" width="24"/></a>`;
      }

      try {
        let allData = [];

        const urlSatuData = "https://satudata.acehutara.go.id/api/3/action/datastore_search?resource_id=559e8bea-c48b-4bda-adbf-5fc146c160ec&limit=500";

        const json1 = await res1.json();

        if (res1.ok && json1.success) {

          }));

        const json2 = await res2.json();

        if (res2.ok && json2.data && json2.data[1]) {
          const tabel = json2.data[1];
          const rows = tabel.data || [];      // daftar kecamatan

          console.log("✅ API BPS berhasil, total kecamatan:", rows.length);
          console.log("🔑 Daftar variabel:", Object.keys(kolom).length);

          // === robust mapping BPS ===
          const dataBPS = [];

          rows.forEach(kec => {
            const namaKec = (kec.label || "-").trim();
            const vars = kec.variables || {};

            for (const kodeVar in vars) {
              if (!kolom[kodeVar]) continue;

              const meta = kolom[kodeVar];
              // normalisasi nama komoditas
              let komoditasRaw = (meta.nama_variabel || "-").toString().trim();
              let komoditas = komoditasRaw
                .replace(/luas panen\s*/i, "")
                .replace(/\(.*?\)/g, "")
                .replace(/\bha\b/i, "")
                .trim();
              if (!komoditas) komoditas = komoditasRaw;

              // ambil raw value
              let rawVal = vars[kodeVar];
              if (rawVal && typeof rawVal === "object") {
                if (rawVal.value != null) rawVal = rawVal.value;
                else if (rawVal.v != null) rawVal = rawVal.v;
                else {
                  const keys = Object.keys(rawVal);
                  if (keys.length === 1 && (typeof rawVal[keys[0]] !== "object")) {
                    rawVal = rawVal[keys[0]];
                  } else {
                    const maybeNum = keys.map(k => rawVal[k]).find(x => x != null && x !== "");
                    rawVal = maybeNum != null ? maybeNum : 0;
                  }
                }
              }

              // parsing ke float
              const luas = rawVal === 0 || rawVal === "0" || rawVal === 0.0
                ? 0
                : (rawVal != null ? parseFloat(String(rawVal).replace(/,/g, ".")) || 0 : 0);

              dataBPS.push({
                kecamatan: namaKec,
                komoditas: komoditas,
                luas: luas,
                tahun: tabel.tahun_data || "2024",
                satuan: meta.satuan || "-",
                sumber: "BPS"
              });
            }

      if (!komoditas) komoditas = komoditasRaw;

      if (rawVal && typeof rawVal === "object") {

  allData = allData.concat(dataBPS2020);

}

  allData = allData.concat(dataBPS2021);

}
