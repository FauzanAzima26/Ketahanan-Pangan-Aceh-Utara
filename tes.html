      <div class="col-md-12 content-area">

        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb bg-light p-2 rounded small mb-0"></ol>

        <div class="single-berita">
          <div class="card" style="width: 100%; display: none;">
            <div class="card-header">
              <h1 class="card-title judul-berita">Title</h1>
              <div class="share-link mt-2">bagikan:</div>

            <div class="card-body isi-berita"></div>
          </div>

<cms:pre:render>CMS_Include('footer.html')</cms:pre:render>

<script type="text/javascript">
  CMS.Loaded(async function () {
    function sosmed(judul) {
      const url = window.location.href;
      return `
        <a href="//www.facebook.com/share.php?u=${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/facebook.png" width="24"/></a>
        <a href="//twitter.com/intent/tweet?url=${url}&text=${judul}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/twitter.png" width="24"/></a>
        <a href="whatsapp://send?text=${judul} ${url}" target="_blank"><img src="/themes/_ceudah-copy/assets/images/whatsapp.png" width="24"/></a>`;
    }

    try {
      let allData = [];

      // === 1. Ambil data dari API Satu Data Aceh Utara ===
      const urlSatuData = "https://satudata.acehutara.go.id/api/3/action/datastore_search?resource_id=559e8bea-c48b-4bda-adbf-5fc146c160ec&limit=500";
      const res1 = await fetch(urlSatuData);
      const json1 = await res1.json();

      if (res1.ok && json1.success) {
        console.log("✅ API Satu Data berhasil:", json1.result.records.length);
        const dataSatuData = json1.result.records.map(r => ({
          kecamatan: r.kemendagri_nama_kecamatan || "-",
          komoditas: r.komotditi || "-",
          luas: parseFloat((r.luas_panen || "0").toString().replace(",", ".")),
          tahun: r.tahun || "2023",
          satuan: "Ha",
          sumber: "Satu Data"
        }));
        allData = allData.concat(dataSatuData);
      }

      // === 2. Ambil data dari API BPS ===
      const urlBPS = "https://webapi.bps.go.id/v1/api/interoperabilitas/datasource/simdasi/id/25/tahun/2024/id_tabel/bXNVb1pmZndqUDhKWElUSjhZRitidz09/wilayah/1111000/key/9a994cbfdcba3e84dbe9eceba615a65f";
      const res2 = await fetch(urlBPS);
      const json2 = await res2.json();

      if (res2.ok && json2.data && json2.data[1]) {
        const tabel = json2.data[1];
        const rows = tabel.data || [];      // daftar kecamatan
        const kolom = tabel.kolom || {};    // metadata variabel

        console.log("✅ API BPS berhasil, total kecamatan:", rows.length);
        console.log("🔑 Daftar variabel:", Object.keys(kolom).length);

        // === robust mapping BPS ===
        const dataBPS = [];

        rows.forEach(kec => {
          const namaKec = (kec.label || "-").trim();
          const vars = kec.variables || {};

          for (const kodeVar in vars) {
            if (!kolom[kodeVar]) continue;

            const meta = kolom[kodeVar];
            // normalisasi nama komoditas
            let komoditasRaw = (meta.nama_variabel || "-").toString().trim();
            let komoditas = komoditasRaw
              .replace(/luas panen\s*/i, "")
              .replace(/\(.*?\)/g, "")
              .replace(/\bha\b/i, "")
              .trim();
            if (!komoditas) komoditas = komoditasRaw;

            // ambil raw value
            let rawVal = vars[kodeVar];
            if (rawVal && typeof rawVal === "object") {
              if (rawVal.value != null) rawVal = rawVal.value;
              else if (rawVal.v != null) rawVal = rawVal.v;
              else {
                const keys = Object.keys(rawVal);
                if (keys.length === 1 && (typeof rawVal[keys[0]] !== "object")) {
                  rawVal = rawVal[keys[0]];
                } else {
                  const maybeNum = keys.map(k => rawVal[k]).find(x => x != null && x !== "");
                  rawVal = maybeNum != null ? maybeNum : 0;
                }
              }
            }

            // parsing ke float
            const luas = rawVal === 0 || rawVal === "0" || rawVal === 0.0
              ? 0
              : (rawVal != null ? parseFloat(String(rawVal).replace(/,/g, ".")) || 0 : 0);

            dataBPS.push({
              kecamatan: namaKec,
              komoditas: komoditas,
              luas: luas,
              tahun: tabel.tahun_data || "2024",
              satuan: meta.satuan || "-",
              sumber: "BPS"
            });
          }
        });

        console.log("📊 Total baris hasil mapping BPS:", dataBPS.length);
        console.groupCollapsed("DEBUG sample mapped BPS");
        console.table(dataBPS.slice(0, 30));
        console.log("BPS rows with luas>0:", dataBPS.filter(r => r.luas > 0).length);
        console.groupEnd();

        allData = allData.concat(dataBPS);
      }

      console.log("📊 Total data gabungan:", allData.length);

      // === 3. Judul & breadcrumb ===
      $(".share-link").append(sosmed("Dashboard Panen"));
      $(".breadcrumb").html(`
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Dashboard Panen</li>`);

      if (segments(1) === "halaman" && segments(2) === "chart-panen") {
        setTitle("Dashboard Luas Panen (Satu Data + BPS)");
        $(".judul-berita").html("Dashboard Luas Panen (Satu Data + BPS)");

        // === 4. Inject HTML Dashboard ===
        $(".isi-berita").html(`<!-- 🔍 FILTER -->
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Kecamatan</strong></label>
        <select class="form-select custom-select" id="filterKecamatan">
          <option value="">-- Semua Kecamatan --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Komoditas</strong></label>
        <select class="form-select custom-select" id="filterKomoditas">
          <option value="">-- Semua Komoditas --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Tahun</strong></label>
        <select class="form-select custom-select" id="filterTahun">
          <option value="">-- Semua Tahun --</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- 📌 RINGKASAN KPI -->
<div class="row mb-3 text-center">
  <div class="col-md-3">
    <div class="kpi-card orange">
      <span id="totalLuas" class="card-value">0</span><small> Ha</small><br>
      <span class="card-text"><strong>Total Luas Panen</strong></span>
      <i class="fas fa-seedling icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card purple">
      <span id="hargaRata" class="card-value">0</span><small> Rp/kg</small><br>
      <span class="card-text"><strong>Harga Rata-rata</strong></span>
      <i class="fas fa-coins icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card grey-dark">
      <span id="kecTerluas" class="card-value">-</span><br>
      <span class="card-text"><strong>Kecamatan Terluas</strong></span>
      <i class="fas fa-map-marker-alt icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card red">
      <span id="komTerluas" class="card-value">-</span><br>
      <span class="card-text"><strong>Komoditas Terluas</strong></span>
      <i class="fas fa-leaf icon"></i>
    </div>
  </div>
</div>

<!-- 🗺️ PETA & GRAFIK -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Luas Panen</strong></div>
      <div class="card-body">
        <div id="horizontalBarChart" style="height:400px;"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Peta Kabupaten</strong></div>
      <div class="card-body">
        <div id="mapContainer" style="height:400px;"></div>
        <div id="mapLegend" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<!-- 📊 PIE & LINE CHART -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Distribusi Komoditas</strong></div>
      <div class="card-body d-flex justify-content-center align-items-center">
        <div id="pieChart" style="height:400px;"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Tren Harga Komoditas</strong></div>
      <div class="card-body">
        <div id="lineChart" style="height:400px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- 📋 DATA DETAIL -->
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Kecamatan</strong></label>
        <select class="form-select custom-select" id="tableFilterKecamatan">
          <option value="">-- Semua Kecamatan --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Komoditas</strong></label>
        <select class="form-select custom-select" id="tableFilterKomoditas">
          <option value="">-- Semua Komoditas --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Tahun</strong></label>
        <select class="form-select custom-select" id="tableFilterTahun">
          <option value="">-- Semua Tahun --</option>
        </select>
      </div>
    </div>
  </div>
</div>

    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered mb-0" id="tableDashboard">
        <thead class="table-light">
  <tr>
    <th>No</th>
    <th><strong>Kecamatan</strong></th>
    <th><strong>Komoditas</strong></th>
    <th><strong>Luas (Ha)</strong></th>
    <th><strong>Tahun</strong></th>
  </tr>
</thead>
        <tbody></tbody>
      </table>
      <div id="pagination" class="mt-2"></div>
    </div>
  </div>
</div>`);
        $(".card").fadeIn();

        // === 5. Load script eksternal ===
        const loadScript = src => new Promise(res => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = res;
          document.body.appendChild(s);
        });

        await loadScript("https://cdn.jsdelivr.net/npm/apexcharts");
        await loadScript("https://cdn.jsdelivr.net/npm/jsvectormap");
        await loadScript("/themes/_ceudah-copy/assets/js/chart-dashboard.js?v=" + Date.now());
        await loadScript("/themes/_ceudah-copy/assets/js/kecamatanmap.js?v=" + Date.now());
        await loadScript("/themes/_ceudah-copy/assets/js/map-dashboard.js?v=" + Date.now());

        // === 6. Render dashboard ===
        initDashboard(allData); // 🔥 gabungan data
      }
    } catch (err) {
      console.error("❌ Gagal load data API:", err);
    }
  });
</script>
