<main role="main">
  <div class="container mt-2 mt-md-0">
    <div class="row">
      <!-- Konten utama -->
      <div class="col-md-12 content-area">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb bg-light p-2 rounded small mb-0"></ol>
        </nav>

        <div class="single-berita">
          <div class="card" style="width: 100%; display: none;">
            <div class="card-header">

<cms:pre:render>CMS_Include('footer.html')</cms:pre:render>

<style>
  /* === Pie & Map === */
  #pieChart {
    width: 100%;
    height: 100% !important;
  }

  #mapLegend {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 4px 8px;
    font-size: 12px;
  }

  #mapLegend .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }

  #mapLegend .legend-color {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    border: 1px solid #aaa;
  }

  /* === KPI Cards === */
  .kpi-card {
    overflow: hidden;
    position: relative;
    box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
    border-radius: 0.5em;
    padding: 1.2em;
    font-family: sans-serif;
    color: #fff;
    height: 100%;
  }

  .kpi-card .card-value {
    display: block;
    font-size: 180%;
    font-weight: bolder;
  }

  .kpi-card .card-text {
    display: block;
    font-size: 80%;
    margin-top: 0.3rem;
  }

  .kpi-card .icon {
    position: absolute;
    top: 0.4rem;
    right: 0.6rem;
    font-size: 300%;
    opacity: 0.2;
  }

  .orange {
    background: #ffc241;
    color: #fff;
  }

  .purple {
    background: #886ab5;
    color: #fff;
  }

  .grey-dark {
    background: #495057;
    color: #efefef;
  }

  .red {
    background: #a83b3b;
    color: #fff;
  }

  .red-gradient {
    background: linear-gradient(180deg, rgba(207, 82, 82, 1) 0%, rgba(121, 9, 9, 1) 80%);
    color: #fff;
  }
</style>

<script type="text/javascript">
  CMS.Loaded(async function () {
    setIcon(CMS_Setting('icon'));

    function sosmed(judul) {
      const url = window.location.href;
      return `
        <a href="//www.facebook.com/share.php?u=${url}" target="_blank">
          <img src="/themes/_ceudah-copy/assets/images/facebook.png" width="24" height="24" />
        </a>
        <a href="//twitter.com/intent/tweet?url=${url}&text=${judul}" target="_blank">
          <img src="/themes/_ceudah-copy/assets/images/twitter.png" width="24" height="24" />
        </a>
        <a href="whatsapp://send?text=${judul} ${url}" target="_blank">
          <img src="/themes/_ceudah-copy/assets/images/whatsapp.png" width="24" height="24" />
        </a>`;
    }

    try {
      // ==== 1. Load semua file JSON multi-tahun ====
      const tahunList = [2020, 2021, 2022, 2023, 2024, 2025];
      let allData = [];

      for (const thn of tahunList) {
        try {
          const res = await fetch(`/themes/_ceudah-copy/assets/json/luas-panen-aceh-utara-${thn}.json?v=${Date.now()}`);
          if (res.ok) {
            const json = await res.json();
            const arr = Array.isArray(json) ? json : (json.dataKecamatan || []);

            // inject tahun saja
            arr.forEach(d => {
              d.tahun = thn;
            });

            allData.push(...arr);
          }
        } catch (e) {
          console.warn("File tidak ada:", thn, e);
        }
      }

      // Kalau kosong, fallback dummy
      if (allData.length === 0) {
        allData = [
          { kecamatan: "Lhoksukon", komoditas: "Padi", luas: 1200, produksi: 3500, harga: 5200, tahun: 2020 },
          { kecamatan: "Samudera", komoditas: "Jagung", luas: 800, produksi: 2100, harga: 4800, tahun: 2020 }
        ];
      }

      // ==== 2. Render judul & breadcrumb ====
      $(".share-link").append(sosmed("Luas Panen Aceh Utara"));
      $(".breadcrumb").html(`
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/${segments(1)}">${segments(1)}</a></li>
        <li class="breadcrumb-item active" aria-current="page">Luas Panen Aceh Utara</li>
      `);

      if (segments(1) === "halaman" && segments(2) === "chart-panen") {
        setTitle("Dashboard Luas Panen Aceh Utara");
        $(".judul-berita").html("Luas Panen Aceh Utara");

        // === Inject HTML Dashboard ===
        $(".isi-berita").html(`<!-- 🔍 FILTER -->
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <div class="row g-3 align-items-center">
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Kecamatan</strong></label>
        <select class="form-select custom-select" id="filterKecamatan">
          <option value="">-- Semua Kecamatan --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Komoditas</strong></label>
        <select class="form-select custom-select" id="filterKomoditas">
          <option value="">-- Semua Komoditas --</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold"><strong>Tahun</strong></label>
        <select class="form-select custom-select" id="filterTahun">
          <option value="">-- Semua Tahun --</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- 📌 RINGKASAN KPI -->
<div class="row mb-3 text-center">
  <div class="col-md-3">
    <div class="kpi-card orange">
      <span id="totalLuas" class="card-value">0</span><small> Ha</small><br>
      <span class="card-text"><strong>Total Luas Panen</strong></span>
      <i class="fas fa-seedling icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card purple">
      <span id="hargaRata" class="card-value">0</span><small> Rp/kg</small><br>
      <span class="card-text"><strong>Harga Rata-rata</strong></span>
      <i class="fas fa-coins icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card grey-dark">
      <span id="kecTerluas" class="card-value">-</span><br>
      <span class="card-text"><strong>Kecamatan Terluas</strong></span>
      <i class="fas fa-map-marker-alt icon"></i>
    </div>
  </div>
  <div class="col-md-3">
    <div class="kpi-card red">
      <span id="komTerluas" class="card-value">-</span><br>
      <span class="card-text"><strong>Komoditas Terluas</strong></span>
      <i class="fas fa-leaf icon"></i>
    </div>
  </div>
</div>

<!-- 🗺️ PETA & GRAFIK -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Luas Panen</strong></div>
      <div class="card-body">
        <div id="horizontalBarChart" style="height:400px;"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Peta Kabupaten</strong></div>
      <div class="card-body">
        <div id="mapContainer" style="height:400px;"></div>
        <div id="mapLegend" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<!-- 📊 PIE & LINE CHART -->
<div class="row mb-3">
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Distribusi Komoditas</strong></div>
      <div class="card-body d-flex justify-content-center align-items-center">
        <div id="pieChart" style="height:400px;"></div>
      </div>
    </div>
  </div>
  <div class="col-lg-6 d-flex">
    <div class="card shadow-sm flex-fill">
      <div class="card-header text-center fw-bold"><strong>Tren Harga Komoditas</strong></div>
      <div class="card-body">
        <div id="lineChart" style="height:400px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- 📋 DATA DETAIL -->
<div class="card shadow-sm mb-3">
  <div class="card-header fw-bold"><strong>Data Panen Per Kecamatan</strong></div>
  <div class="card-body">
    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <select class="form-select" id="tableFilterKecamatan">
          <option value="">-- Semua Kecamatan --</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select" id="tableFilterKomoditas">
          <option value="">-- Semua Komoditas --</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select" id="tableFilterTahun">
          <option value="">-- Semua Tahun --</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered mb-0" id="tabelPanen">
        <thead class="table-light">
          <tr>
            <th>No</th>
            <th><strong>Kecamatan</strong></th>
            <th><strong>Komoditas</strong></th>
            <th><strong>Luas (Ha)</strong></th>
            <th><strong>Produksi (Ton)</strong></th>
            <th><strong>Harga (Rp/Kg)</strong></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>`);

        $(".card").fadeIn();

        // ==== 3. Load scripts eksternal ====
        const loadScript = src => new Promise(res => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = res;
          document.body.appendChild(s);
        });

        await loadScript("https://cdn.jsdelivr.net/npm/apexcharts");
        await loadScript("/themes/_ceudah-copy/assets/js/chart-dashboard.js?v=" + Date.now());
        await loadScript("https://cdn.jsdelivr.net/npm/jsvectormap");
        await loadScript("/themes/_ceudah-copy/assets/js/kecamatanmap.js?v=" + Date.now());
        await loadScript("/themes/_ceudah-copy/assets/js/map-dashboard.js?v=" + Date.now());

        // ==== 4. Isi dropdown filter ====
        const kecSet = [...new Set(allData.map(d => d.kecamatan))];
        const komSet = [...new Set(allData.map(d => d.komoditas))];
        const thnSet = [...new Set(allData.map(d => d.tahun))];

        kecSet.forEach(k => $("#filterKecamatan, #tableFilterKecamatan").append(`<option value="${k}">${k}</option>`));
        komSet.forEach(k => $("#filterKomoditas, #tableFilterKomoditas").append(`<option value="${k}">${k}</option>`));
        thnSet.forEach(t => $("#filterTahun, #tableFilterTahun").append(`<option value="${t}">${t}</option>`));

        // ==== 5. Function apply filter global ====
        function applyFilters() {
          const kec = $("#filterKecamatan").val();
          const kom = $("#filterKomoditas").val();
          const thn = $("#filterTahun").val();

          let filtered = [...allData];
          if (kec) filtered = filtered.filter(d => d.kecamatan === kec);
          if (kom) filtered = filtered.filter(d => d.komoditas === kom);
          if (thn) filtered = filtered.filter(d => String(d.tahun) === String(thn));

          renderCharts(filtered);
          renderTable(filtered);
        }

        // Bind filter global
        $("#filterKecamatan, #filterKomoditas, #filterTahun").on("change", applyFilters);

        // Tabel filter
        $("#tableFilterKecamatan, #tableFilterKomoditas, #tableFilterTahun").on("change", function () {
          const kec = $("#tableFilterKecamatan").val();
          const kom = $("#tableFilterKomoditas").val();
          const thn = $("#tableFilterTahun").val();

          let filtered = [...allData];
          if (kec) filtered = filtered.filter(d => d.kecamatan === kec);
          if (kom) filtered = filtered.filter(d => d.komoditas === kom);
          if (thn) filtered = filtered.filter(d => String(d.tahun) === String(thn));

          renderTable(filtered);
        });

        // ==== 6. Render awal ====
        renderMap();
        applyFilters(); // default: semua data
      }
    } catch (err) {
      console.error("Gagal load JSON:", err);
    }
  });
</script>
